<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none">
  <!-- E-commerce x AI Prompt Pattern Tile -->
  <g stroke="#2563eb" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ==================== E-COMMERCE MOTIFS ==================== -->
    
    <!-- Shopping Cart -->
    <path d="M120 180h24l16 80h72l12-56h-96" opacity="0.3"/>
    <circle cx="168" cy="280" r="6" fill="#2563eb" stroke="none" opacity="0.25"/>
    <circle cx="216" cy="280" r="6" fill="#2563eb" stroke="none" opacity="0.25"/>

    <!-- Shopping Bag -->
    <path d="M460 380h60v80h-60z" opacity="0.2"/>
    <path d="M475 380v-16a15 15 0 0 1 30 0v16" opacity="0.25"/>
    <path d="M490 410v16" opacity="0.15"/>

    <!-- Price/Discount Tag -->
    <path d="M600 160l-30 30v40h40l30-30a28 28 0 0 0-40-40z" opacity="0.22"/>
